<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title and Fab-icon -->
    <title>English Janala | Best Platform To Practice English</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon" />

    <!-- Tailwind and DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Font Integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <!-- stylesheet -->
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <!-- Navbar -->
    <header>
      <nav>
        <div class="navbar bg-base-100 shadow-sm md:px-16 bg-[#badeff5b]">
          <div class="navbar-start">
            <div class="dropdown">
              <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" /> </svg>
              </div>
              <ul
                tabindex="-1"
                class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
                  <li><a href="" class="w-full"><button class="btn btn-dash btn-primary w-44"><i class="fa-solid fa-circle-question" style="color: rgba(15, 61, 129, 0.913);"></i>FAQ</button></a></li>

                  <li><a href=""><button class="btn btn-dash btn-primary w-44"><i class="fa-solid fa-book-open" style="color: rgba(15, 61, 129, 0.886);"></i>Learn</button></a></li>

                  <li><a href=""><button class="btn btn-dash btn-primary w-44"><i class="fa-solid fa-right-from-bracket" style="color: rgba(15, 61, 129, 0.893);"></i>LogOut</button></a></li>
              </ul>
            </div>
            <a href="" class="flex items-center gap-1">
              <span class="text-[20px] font-semibold text-[#18181B]">English</span>
              <img src="./assets/logo.png" alt="">
              <span class="text-[20px] font-semibold  bangla-font">জানালা</span>
            </a>
          </div>
          <div class="navbar-end hidden lg:flex">
            <ul class=" none flex gap-3 items-center">
              <li><a href=""><button class="btn btn-dash btn-primary"><i class="fa-solid fa-circle-question" style="color: rgba(15, 61, 129, 0.913);"></i>FAQ</button></a></li>

              <li><a href=""><button class="btn btn-dash btn-primary"><i class="fa-solid fa-book-open" style="color: rgba(15, 61, 129, 0.886);"></i>Learn</button></a></li>

              <li><a href=""><button class="btn btn-dash btn-primary"><i class="fa-solid fa-right-from-bracket" style="color: rgba(15, 61, 129, 0.893);"></i>LogOut</button></a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <!-- Banner -->
    <section class="Banner mb-18">
      <div class="hero bg-base-200 mx-auto md:py-8">
        <div class="hero-content flex-col lg:flex-row-reverse gap-x-56 ">
          <img
            alt="Tailwind CSS hero component"
            src="./assets/hero-student.png"
            class="max-w-72 md:max-w-sm rounded-lg"
          />
          <div>
            
           <h1 class="md:text-5xl text-3xl font-bold text-center md:text-left"><span class="text-[#00BCFF]">English</span> is Easy!!</h1> 
           <p class="py-6 bangla-font text-[#18181B] max-w-80 md:max-w-96 text-center md:text-left">
              আজ থেকেই আপনার ভাষা শেখার যাত্রা শুরু করুন। আপনি যদি নতুন হন অথবা আপনার দক্ষতা বাড়াতে চান, আমাদের Interactive Lessons আপনাকে নিয়ে যাবে অন্য একটি Level এ 
            </p>
            <div class="flex justify-center md:justify-start">
              <div class="space-y-3">
                <input class="block border-gray-400 rounded-sm p-1.5 max-w-80 md:max-w-80" type="text" name="" id="" placeholder="Enter Your Name">
                <input class="block border-gray-400 rounded-sm p-1.5 max-w-80 md:max-w-80" type="password" name="" id="" placeholder="Enter Password">
                <button class="btn btn-primary block text-center"><a href="./index.html">Get Started</a></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Vocabulary Lesson -->
     <section class="mb-9">
        <h1 class="md:text-5xl text-3xl font-bold text-center mb-6"><span class="text-[#00BCFF]">Let's</span> Learn Vocabularies</h1> 

        <div id="lessons-container" class="flex justify-center gap-3 flex-wrap mb-10">

        </div>

        <!-- loading spinner -->
        <section id="spinner" class="flex justify-center hidden items-center py-10">
          <span class="loading loading-infinity loading-xl"></span>
        </section>

        <!-- lesson button container -->
        <section id="word-container" class="bg-gray-100 p-10 container rounded-2xl mx-auto md:mt-5 flex flex-wrap flex-col md:flex-row justify-center items-center text-center gap-11">
          <div class="bangla-font bg-[#00bbff34] w-10/12 p-10 rounded-2xl space-y-3">
            <p class="text-[#79716B] text-[20px]">আপনি এখনো কোনো Lesson Select করেন নি</p>
            <h2 class="text-[#292524] text-[34.31px] font-medium">একটি Lesson Select করুন।</h2>
          </div>
        </section>

        <!-- Modal for word info -->
        <dialog id="word_modal" class="modal modal-bottom sm:modal-middle">
          <div class="modal-box">
            <div id="details-container">
              
            </div>
            <div class="modal-action">
              <form method="dialog">
                <!-- if there is a button in form, it will close the modal -->
                <button class="btn">Close</button>
              </form>
            </div>
          </div>
        </dialog>
     </section>

     <script src="script/index.js"></script>
  </body>
</html>
